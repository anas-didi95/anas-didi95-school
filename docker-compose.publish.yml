---
services:
  app-publish:
    build:
      dockerfile: "Dockerfile.publish"
      tags:
        - "school-app:test"
    env_file:
      - ".env"
    logging:
      driver: "local"
    networks:
      - "anas-didi95-network"
    ports:
      - "8081:8080"
    volumes:
      - "./.h2/:/home/app/.h2/:z"

networks:
  anas-didi95-network:
    external: true
